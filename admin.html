<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBO Admin</title><link rel="stylesheet" href="styles.css?v=2"><style>.admin-wrap{max-width:1120px;margin:auto;padding:55px 4%}.admin-box{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px;margin:18px 0}.admin-grid{display:grid;grid-template-columns:1fr 220px;gap:10px}.admin-input,.admin-select{width:100%;box-sizing:border-box;padding:11px;margin:4px 0}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.admin-btn{padding:10px 14px;border:0;border-radius:8px;background:#e63946;color:#fff;font-weight:800}.admin-secondary{background:#e9edf2;color:#334155}.admin-player-grid,.roster-admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.admin-player,.roster-admin-card{border:1px solid #e5e7eb;border-radius:12px;padding:14px}.admin-fields{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.admin-fields input{width:100%;box-sizing:border-box}.hidden{display:none!important}@media(max-width:760px){.admin-grid,.admin-player-grid,.roster-admin-grid{grid-template-columns:1fr}.admin-fields{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="logo" href="index.html">KBO<span>LEAGUE</span></a><a href="index.html">← 사이트</a></div></header><main class="admin-wrap"><section id="login" class="admin-box"><h1>사이트 관리</h1><p>GitHub token 입력 후 데이터 불러오기를 누르세요.</p><input id="token" class="admin-input" type="password" placeholder="GitHub token"><div class="admin-actions"><button id="load" class="admin-btn">데이터 불러오기</button></div><p id="login-status"></p></section><section id="workspace" class="hidden"><section class="admin-box"><h2>👥 팀 관리</h2><div id="teams-admin" class="admin-player-grid"></div><div class="admin-actions"><button id="add-team" class="admin-btn">+ 팀 추가</button><button id="save-teams" class="admin-btn">팀 저장 → GitHub</button></div></section><section class="admin-box"><h2>📊 순위표 관리</h2><div id="standings-admin"></div><div class="admin-actions"><button id="add-standing" class="admin-btn">+ 순위 팀 추가</button><button id="save-standings" class="admin-btn">순위 저장 → GitHub</button></div></section><section class="admin-box"><h2>📋 로스터 관리</h2><div id="rosters-admin" class="roster-admin-grid"></div><div class="admin-actions"><button id="save-rosters" class="admin-btn">로스터 저장 → GitHub</button></div></section><section class="admin-box"><h2>⚾ 선수 성적 관리</h2><div class="admin-grid"><input id="search" class="admin-input" placeholder="선수 검색"><select id="team" class="admin-select"><option value="">모든 팀</option></select></div><div class="admin-actions"><button id="add" class="admin-btn admin-secondary">+ 선수 추가</button><button id="save" class="admin-btn">전체 저장 → GitHub</button></div><p id="status"></p></section><div id="players" class="admin-player-grid"></div></section></main><script src="admin.js?v=5"></script></body></html>
