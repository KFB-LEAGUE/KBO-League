<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBO Admin</title><link rel="stylesheet" href="styles.css?v=3"><style>.admin-wrap{max-width:1120px;margin:auto;padding:55px 4%}.admin-box{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px;margin:18px 0}.admin-grid{display:grid;grid-template-columns:1fr 220px;gap:10px}.admin-input,.admin-select{width:100%;box-sizing:border-box;padding:11px;margin:4px 0}.admin-btn{padding:10px 14px;border:0;border-radius:8px;background:#e63946;color:#fff;font-weight:800}.admin-player-grid,.roster-admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.admin-player{border:1px solid #e5e7eb;border-radius:12px;padding:14px}.hidden{display:none!important}@media(max-width:760px){.admin-grid,.admin-player-grid,.roster-admin-grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="logo" href="index.html">KBO</a></div></header><main class="admin-wrap"><section id="login" class="admin-box"><h1>KBO 관리</h1><input id="token" class="admin-input" type="password" placeholder="GitHub token"><button id="load" class="admin-btn">데이터 불러오기</button><p id="login-status"></p></section><section id="workspace" class="hidden"><section class="admin-box"><h2>팀 관리</h2><div id="teams-admin" class="admin-player-grid"></div><button id="add-team" class="admin-btn">+ 팀 추가</button><button id="save-teams" class="admin-btn">팀 저장</button></section><section class="admin-box"><h2>순위표 관리</h2><div id="standings-admin"></div><button id="add-standing" class="admin-btn">+ 순위 팀 추가</button><button id="save-standings" class="admin-btn">순위 저장</button></section><section class="admin-box"><h2>로스터 관리</h2><select id="roster-team" class="admin-select"><option value="">팀 선택</option></select><select id="roster-type" class="admin-select"><option value="players">선수</option><option value="pm">PM</option><option value="am">AM</option><option value="preSign">Pre Sign</option></select><input id="roster-name" class="admin-input" placeholder="이름 입력"><button id="add-roster" class="admin-btn">+ 로스터 추가</button><div id="rosters-admin" class="roster-admin-grid"></div><button id="save-rosters" class="admin-btn">로스터 저장</button></section><section class="admin-box"><h2>선수 성적 관리</h2><div class="admin-grid"><input id="search" class="admin-input" placeholder="선수 검색"><select id="team" class="admin-select"><option value="">모든 팀</option></select></div><button id="add" class="admin-btn">+ 선수 추가</button><button id="save" class="admin-btn">선수 성적 저장</button><p id="status"></p></section><div id="players" class="admin-player-grid"></div></section></main><script src="admin.js?v=7"></script></body></html>
